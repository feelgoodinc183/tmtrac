<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TMTRAC</title>
<style>
  :root { color-scheme: light dark; --bg: #f8fafc; --ink: #0f172a; --muted: #475569; --accent: #0369a1; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --ink: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 24px; }
  button { min-height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Can't reach TMTRAC</h1>
  <p>This phone has no connection to the race server. Check mobile data or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.replace(window.TMTRAC_URL || 'https://tmtrac.my')">Try again</button>
  <script src="app-url.js"></script>
</main>
</body>
</html>
